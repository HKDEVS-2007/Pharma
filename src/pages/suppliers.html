<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Pharmco – Suppliers</title>
<link rel="stylesheet" href="../css/style.css"/>
<script>try{if(localStorage.getItem("pharmco_theme")==="dark")document.documentElement.classList.add("dark-pre");}catch(e){}</script>
</head>
<body>
<div class="win-titlebar" id="winTitlebar">
  <span class="win-title-label" id="winPhName">Pharmco</span>
  <div class="win-controls">
    <button class="win-btn" onclick="window.api.winMinimize()" title="Minimize">&#8211;</button>
    <button class="win-btn maximize" id="winMaxBtn" onclick="toggleMax()" title="Maximize/Restore">&#9633;</button>
    <button class="win-btn close" onclick="window.api.winClose()" title="Close">&#10005;</button>
  </div>
</div>
<script>
async function toggleMax(){
  window.api.winMaximize();
  setTimeout(async()=>{
    const m=await window.api.winIsMaximized();
    const btn=document.getElementById('winMaxBtn');
    if(btn)btn.innerHTML=m?'&#10697;':'&#9633;';
  },80);
}
</script>
<div class="topbar">
  <img id="picPharmcoLogo" class="logo-img" src="" alt="💊"/>
  <div class="pharmacy-name" id="lblPharmcoName">Pharmco</div>
  <div class="topbar-right">
    <span class="lbl-user" id="lblUser"></span>
    <span class="lbl-dt" id="lblDT"></span>
    <button class="icon-btn" id="picSettings">⚙</button>
    <button class="icon-btn" id="picLogout">⏻</button>
  </div>
</div>
<div class="page-body">
  <div class="page-header">
    <button class="btn" onclick="window.api.navigate('dashboard')">Dashboard</button>
    <h1>🤝 Suppliers</h1>
  </div>
  
  <div class="glass-card">
    <div class="card-title">Add / Edit Supplier</div>
    <div id="alertMsg" class="alert"></div>
    <div class="form-grid">
      <div class="form-group">
        <label>Supplier ID</label>
        <input type="text" id="txtSupId" class="form-control" placeholder="Auto" readonly/>
      </div>
      <div class="form-group">
        <label>Supplier Name *</label>
        <input type="text" id="txtSupName" class="form-control" placeholder="Enter supplier name"/>
      </div>
      <div class="form-group">
        <label>Contact</label>
        <input type="text" id="txtSC" class="form-control" placeholder="Phone number"/>
      </div>
      <div class="form-group">
        <label>Address</label>
        <input type="text" id="txtSA" class="form-control" placeholder="Supplier address"/>
      </div>
    </div>
    <div class="flex gap-4 mt-8">
      <button class="btn btn-primary" id="btnAdd">➕ Add Supplier</button>
      <button class="btn btn-warning" id="btnUpdate">✏ Update</button>
      <button class="btn btn-danger" id="btnDelete">🗑 Delete</button>
      <button class="btn btn-secondary" onclick="clearForm()">✖ Clear</button>
    </div>
  </div>
  
  <div class="glass-card">
    <div class="card-title" style="margin-bottom:24px">Suppliers List</div>
    <div class="table-wrapper">
      <table class="dgv">
        <thead><tr><th>ID</th><th>Supplier Name</th><th>Contact</th><th>Address</th></tr></thead>
        <tbody id="supBody"></tbody>
      </table>
    </div>
  </div>
</div>
<script src="../js/common.js"></script>
<script>
requireAuthWithAccess('suppliers'); loadTopBar();
let selectedId = null;

async function loadSuppliers() {
  const sups = await window.api.getSuppliers();
  buildTable('supBody', sups, [
    {key:'id'},{key:'suppliername'},{key:'suppliercontact'},{key:'supplieraddress'}
  ]);
  document.getElementById('supBody').addEventListener('row-selected', e => {
    const r = e.detail;
    selectedId = r.id;
    document.getElementById('txtSupId').value = r.id;
    document.getElementById('txtSupName').value = r.suppliername||'';
    document.getElementById('txtSC').value = r.suppliercontact||'';
    document.getElementById('txtSA').value = r.supplieraddress||'';
  });
}

function clearForm() {
  selectedId = null;
  ['txtSupId','txtSupName','txtSC','txtSA'].forEach(id => document.getElementById(id).value='');
}

function getFormData() {
  return {
    suppliername: document.getElementById('txtSupName').value.trim(),
    suppliercontact: document.getElementById('txtSC').value.trim(),
    supplieraddress: document.getElementById('txtSA').value.trim()
  };
}

document.getElementById('btnAdd').onclick = async () => {
  const d = getFormData();
  if (!d.suppliername) { showAlert('alertMsg','Supplier name is required.'); return; }
  await window.api.addSupplier(d);
  showAlert('alertMsg','Supplier added!','success');
  clearForm(); loadSuppliers();
};

document.getElementById('btnUpdate').onclick = async () => {
  if (!selectedId) { showAlert('alertMsg','Please select a supplier to update.'); return; }
  const d = getFormData(); d.id = selectedId;
  if (!d.suppliername) { showAlert('alertMsg','Supplier name is required.'); return; }
  await window.api.updateSupplier(d);
  showAlert('alertMsg','Supplier updated!','success');
  clearForm(); loadSuppliers();
};

document.getElementById('btnDelete').onclick = async () => {
  if (!selectedId) { showAlert('alertMsg','Please select a supplier to delete.'); return; }
  if (!confirm('Delete this supplier?')) return;
  await window.api.deleteSupplier(selectedId);
  showAlert('alertMsg','Supplier deleted.','success');
  clearForm(); loadSuppliers();
};

loadSuppliers();
</script>
</body>
</html>
