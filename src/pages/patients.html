<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Pharmco – Permanent Patients</title>
<link rel="stylesheet" href="../css/style.css"/>
<script>try{if(localStorage.getItem("pharmco_theme")==="dark")document.documentElement.classList.add("dark-pre");}catch(e){}</script>
</head>
<body>
<div class="win-titlebar" id="winTitlebar">
  <span class="win-title-label" id="winPhName">Pharmco</span>
  <div class="win-controls">
    <button class="win-btn" onclick="window.api.winMinimize()">&#8211;</button>
    <button class="win-btn maximize" id="winMaxBtn" onclick="toggleMax()">&#9633;</button>
    <button class="win-btn close" onclick="window.api.winClose()">&#10005;</button>
  </div>
</div>
<script>async function toggleMax(){window.api.winMaximize();setTimeout(async()=>{const m=await window.api.winIsMaximized();const b=document.getElementById('winMaxBtn');if(b)b.innerHTML=m?'&#10697;':'&#9633;';},80);}</script>

<div class="topbar">
  <img id="picPharmcoLogo" class="logo-img" src="" alt="💊"/>
  <div class="pharmacy-name" id="lblPharmcoName">Pharmco</div>
  <div class="topbar-right">
    <span class="lbl-user" id="lblUser"></span>
    <span class="lbl-dt" id="lblDT"></span>
    <button class="icon-btn" id="picSettings">⚙</button>
    <button class="icon-btn" id="picLogout">⏻</button>
  </div>
</div>

<div class="page-body">
  <div class="page-header">
    <button class="btn" onclick="window.api.navigate('dashboard')">Dashboard</button>
    <h1>🏥 Permanent Patients</h1>
  </div>

  <!-- ADD / EDIT PATIENT -->
  <div class="glass-card">
    <div class="card-title">Add / Edit Patient</div>
    <div id="alertMsg" class="alert"></div>
    <div class="form-grid">
      <div class="form-group">
        <label>Patient Name *</label>
        <input type="text" id="txtName" class="form-control" placeholder="Full name"/>
      </div>
      <div class="form-group">
        <label>Mobile No</label>
        <input type="text" id="txtMobile" class="form-control" placeholder="Phone number"/>
      </div>
      <div class="form-group">
        <label>Address</label>
        <input type="text" id="txtAddress" class="form-control" placeholder="Patient address"/>
      </div>
      <div class="form-group">
        <label>Illness / Disease</label>
        <input type="text" id="txtIllness" class="form-control" placeholder="e.g. Diabetes, Heart Problem, Kidney"/>
      </div>
      <div class="form-group" style="grid-column:span 2">
        <label>Notes</label>
        <input type="text" id="txtNotes" class="form-control" placeholder="Any additional notes"/>
      </div>
    </div>
    <div class="flex gap-4 mt-8">
      <button class="btn btn-primary" onclick="addPatient()">➕ Add Patient</button>
      <button class="btn btn-warning" onclick="updatePatient()">✏ Update</button>
      <button class="btn btn-danger" onclick="deletePatient()">🗑 Delete</button>
      <button class="btn btn-secondary" onclick="clearForm()">✖ Clear</button>
    </div>
  </div>

  <!-- PATIENTS LIST -->
  <div class="glass-card">
    <div class="flex justify-between items-center mb-8">
      <div class="card-title" style="margin-bottom:0">Registered Patients</div>
      <div class="form-group" style="min-width:300px; margin-bottom:0">
        <input type="text" id="txtSearch" class="form-control" placeholder="🔍 Search patient..."/>
      </div>
    </div>
    <div class="table-wrapper">
      <table class="dgv">
        <thead>
          <tr><th>ID</th><th>Name</th><th>Mobile</th><th>Address</th><th>Illness</th><th>Notes</th><th>Since</th></tr>
        </thead>
        <tbody id="patBody"></tbody>
      </table>
    </div>
  </div>

  <!-- PATIENT DOSE HISTORY (visible when patient selected) -->
  <div class="glass-card" id="doseHistCard" style="display:none;">
    <div class="card-title">📋 Dose History – <span id="selectedPatientName"></span></div>
    <div class="table-wrapper">
      <table class="dgv">
        <thead>
          <tr><th>Bill No</th><th>Sale Date</th><th>Medicine</th><th>Qty</th><th>Price</th><th>Dose Days</th><th>Dose Ends</th><th>Status</th></tr>
        </thead>
        <tbody id="doseBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script src="../js/common.js"></script>
<script>
requireAuthWithAccess('patients');
loadTopBar();

let selectedId = null;
let allPatients = [];

async function loadPatients(search='') {
  allPatients = await window.api.getPatients();
  const filtered = search ? allPatients.filter(p => p.name.toLowerCase().includes(search.toLowerCase()) || (p.mobile||'').includes(search) || (p.illness||'').toLowerCase().includes(search.toLowerCase())) : allPatients;
  const tbody = document.getElementById('patBody');
  tbody.innerHTML = '';
  filtered.forEach(p => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${p.id}</td><td><b>${p.name}</b></td><td>${p.mobile||''}</td><td>${p.address||''}</td>
      <td><span class="badge badge-warning">${p.illness||''}</span></td><td>${p.notes||''}</td><td>${p.createdate||''}</td>`;
    tr.addEventListener('click', () => {
      tbody.querySelectorAll('tr').forEach(r=>r.classList.remove('selected'));
      tr.classList.add('selected');
      selectedId = p.id;
      document.getElementById('txtName').value = p.name||'';
      document.getElementById('txtMobile').value = p.mobile||'';
      document.getElementById('txtAddress').value = p.address||'';
      document.getElementById('txtIllness').value = p.illness||'';
      document.getElementById('txtNotes').value = p.notes||'';
      loadDoseHistory(p.id, p.name);
    });
    tbody.appendChild(tr);
  });
}

async function loadDoseHistory(patientid, name) {
  document.getElementById('selectedPatientName').textContent = name;
  document.getElementById('doseHistCard').style.display = 'block';
  const rows = await window.api.getPatientSaleHistory(patientid);
  const tbody = document.getElementById('doseBody');
  tbody.innerHTML = '';
  const today = new Date().toISOString().split('T')[0];
  // Group by billno to avoid duplicate rows (one per bill)
  const bills = {};
  rows.forEach(r => {
    if (!bills[r.billno]) bills[r.billno] = { ...r, medicines: [] };
    bills[r.billno].medicines.push({ name: r.medicinename, qty: r.quantity, price: r.saleprice });
  });
  Object.values(bills).forEach(bill => {
    const ended = bill.doseenddate && bill.doseenddate <= today;
    const statusBadge = !bill.doseenddate ? '' : ended
      ? '<span class="badge badge-danger">Dose Ended</span>'
      : '<span class="badge badge-success">Active</span>';
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><b>${bill.billno}</b></td>
      <td>${bill.saledate||''}</td>
      <td>${bill.medicines.map(m=>m.name).join(', ')}</td>
      <td>${bill.medicines.map(m=>m.qty).join(', ')}</td>
      <td>${bill.medicines.map(m=>parseFloat(m.price||0).toFixed(2)).join(', ')}</td>
      <td>${bill.dosedays ? bill.dosedays+' days' : '—'}</td>
      <td>${bill.doseenddate||'—'}</td>
      <td>${statusBadge}</td>`;
    tbody.appendChild(tr);
  });
  if (Object.keys(bills).length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:var(--text-light);padding:20px;">No sale history for this patient.</td></tr>';
  }
}

function clearForm() {
  selectedId = null;
  ['txtName','txtMobile','txtAddress','txtIllness','txtNotes'].forEach(id => document.getElementById(id).value='');
  document.getElementById('patBody').querySelectorAll('tr').forEach(r=>r.classList.remove('selected'));
  document.getElementById('doseHistCard').style.display = 'none';
}

function getFormData() {
  return {
    name:    document.getElementById('txtName').value.trim(),
    mobile:  document.getElementById('txtMobile').value.trim()||null,
    address: document.getElementById('txtAddress').value.trim()||null,
    illness: document.getElementById('txtIllness').value.trim()||null,
    notes:   document.getElementById('txtNotes').value.trim()||null
  };
}

async function addPatient() {
  const d = getFormData();
  if (!d.name) { showAlert('alertMsg','Patient name is required.'); return; }
  const r = await window.api.addPatient(d);
  if (r.success) { showAlert('alertMsg','Patient added!','success'); clearForm(); loadPatients(); }
  else showAlert('alertMsg','Error: '+(r.error||'Unknown'));
}

async function updatePatient() {
  if (!selectedId) { showAlert('alertMsg','Select a patient to update.'); return; }
  const d = getFormData(); d.id = selectedId;
  if (!d.name) { showAlert('alertMsg','Name is required.'); return; }
  await window.api.updatePatient(d);
  showAlert('alertMsg','Patient updated!','success'); clearForm(); loadPatients();
}

async function deletePatient() {
  if (!selectedId) { showAlert('alertMsg','Select a patient to delete.'); return; }
  if (!confirm('Delete this patient and all their dose records?')) return;
  await window.api.deletePatient(selectedId);
  showAlert('alertMsg','Patient deleted.','success'); clearForm(); loadPatients();
}

document.getElementById('txtSearch').addEventListener('input', e => loadPatients(e.target.value));
loadPatients();
</script>
</body>
</html>
