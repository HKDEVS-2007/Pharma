<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Pharmco – Patient Summary</title>
<link rel="stylesheet" href="../css/style.css"/>
<script>try{if(localStorage.getItem("pharmco_theme")==="dark")document.documentElement.classList.add("dark-pre");}catch(e){}</script>
<style>
  .dose-card { border-radius:10px; padding:14px 16px; margin-bottom:10px; display:flex; align-items:center; gap:14px; border:1.5px solid var(--border); background:var(--surface); }
  .dose-card.ended { border-color:#ef5350; background:rgba(198,40,40,0.05); }
  .dose-card.active { border-color:#2e7d32; background:rgba(46,125,50,0.05); }
  .dose-card.due-soon { border-color:#f57f17; background:rgba(245,127,23,0.05); }
  .dose-icon { font-size:28px; flex-shrink:0; }
  .dose-info { flex:1; }
  .dose-info b { font-size:14px; }
  .dose-info .dose-sub { font-size:12px; color:var(--text-light); margin-top:2px; }
  .dose-days-badge { padding:4px 12px; border-radius:20px; font-size:12px; font-weight:700; flex-shrink:0; }
</style>
</head>
<body>
<div class="win-titlebar" id="winTitlebar">
  <span class="win-title-label" id="winPhName">Pharmco</span>
  <div class="win-controls">
    <button class="win-btn" onclick="window.api.winMinimize()">&#8211;</button>
    <button class="win-btn maximize" id="winMaxBtn" onclick="toggleMax()">&#9633;</button>
    <button class="win-btn close" onclick="window.api.winClose()" title="Close">&#10005;</button>
  </div>
</div>
<script>async function toggleMax(){window.api.winMaximize();setTimeout(async()=>{const m=await window.api.winIsMaximized();const b=document.getElementById('winMaxBtn');if(b)b.innerHTML=m?'&#10697;':'&#9633;';},80);}</script>

<div class="topbar">
  <img id="picPharmcoLogo" class="logo-img" src="" alt="💊"/>
  <div class="pharmacy-name" id="lblPharmcoName">Pharmco</div>
  <div class="topbar-right">
    <span class="lbl-user" id="lblUser"></span>
    <span class="lbl-dt" id="lblDT"></span>
    <button class="icon-btn" id="picSettings">⚙</button>
    <button class="icon-btn" id="picLogout">⏻</button>
  </div>
</div>

<div class="page-body">
  <div class="page-header">
    <button class="btn" onclick="window.api.navigate('dashboard')">Dashboard</button>
    <h1>📋 Patient Dose Summary</h1>
  </div>

  <!-- Filter -->
  <div class="glass-card">
    <div class="card-title">Select Patient</div>
    <div class="search-form">
      <div class="form-group" style="min-width:300px;">
        <label>Patient</label>
        <select id="cmbPatient" class="form-control">
          <option value="">-- Select a Patient --</option>
        </select>
      </div>
      <button class="btn btn-primary" onclick="loadSummary()">🔍 View History</button>
      <button class="btn btn-secondary" onclick="showAllDue()">⏰ Show All Due Doses</button>
    </div>
  </div>

  <!-- Patient Info -->
  <div id="patInfoCard" style="display:none;" class="glass-card">
    <div class="card-title">👤 Patient Information</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:24px;" id="patInfoGrid"></div>
  </div>

  <!-- Dose Status Cards -->
  <div id="doseStatusSection" style="display:none;">
    <div class="glass-card">
      <div class="card-title" style="margin-bottom:24px">💊 Dose History &amp; Status</div>
      <div id="doseCards"></div>
    </div>

    <!-- Full Bill History Table -->
    <div class="glass-card">
      <div class="card-title" style="margin-bottom:24px">📄 Detailed Medicine Records</div>
      <div class="table-wrapper">
        <table class="dgv">
          <thead>
            <tr><th>Bill No</th><th>Medicine</th><th>Qty</th><th>Sale Price</th><th>Total</th><th>Sale Date</th><th>Dose Days</th><th>Dose Ends</th><th>Status</th></tr>
          </thead>
          <tbody id="histBody"></tbody>
        </table>
      </div>
      <!-- Totals -->
      <div class="dash-grid" style="margin-top:24px">
        <div class="glass-card stat-card"><div class="stat-label">Total Bills</div><div class="stat-value" id="statBills" style="color:var(--primary);">0</div></div>
        <div class="glass-card stat-card"><div class="stat-label">Total Spent</div><div class="stat-value" id="statSpent" style="color:var(--secondary);">0.00</div></div>
        <div class="glass-card stat-card"><div class="stat-label">Medicines Taken</div><div class="stat-value" id="statQty" style="color:var(--accent);">0</div></div>
      </div>
    </div>
  </div>

  <!-- All Due Doses Section -->
  <div id="allDueSection" style="display:none;" class="glass-card">
    <div class="card-title">⏰ All Patients with Due / Ending Doses</div>
    <div id="allDueList"></div>
  </div>
</div>

<script src="../js/common.js"></script>
<script>
requireAuthWithAccess('patientsummary');
loadTopBar();

let patients = [];

async function init() {
  patients = await window.api.getPatients();
  const sel = document.getElementById('cmbPatient');
  patients.forEach(p => sel.innerHTML += `<option value="${p.id}">${p.name}${p.illness?' — '+p.illness:''} | ${p.mobile||'No phone'}</option>`);
}

async function loadSummary() {
  const patientid = document.getElementById('cmbPatient').value;
  if (!patientid) { alert('Please select a patient first.'); return; }
  document.getElementById('allDueSection').style.display='none';

  const patient = patients.find(p=>p.id==patientid);
  const rows = await window.api.getPatientSaleHistory(patientid);

  // Patient info card
  document.getElementById('patInfoCard').style.display='block';
  document.getElementById('patInfoGrid').innerHTML = `
    <div><div class="stat-label">Name</div><b style="font-size:15px">${patient.name}</b></div>
    <div><div class="stat-label">Mobile</div><b>${patient.mobile||'—'}</b></div>
    <div><div class="stat-label">Address</div>${patient.address||'—'}</div>
    <div><div class="stat-label">Illness / Disease</div><span class="badge badge-warning">${patient.illness||'—'}</span></div>
    <div><div class="stat-label">Notes</div>${patient.notes||'—'}</div>
    <div><div class="stat-label">Patient Since</div>${patient.createdate||'—'}</div>`;

  // Group by billno
  const billMap = {};
  rows.forEach(r => {
    if (!billMap[r.billno]) billMap[r.billno]={ billno:r.billno, saledate:r.saledate, dosedays:r.dosedays, doseenddate:r.doseenddate, notified:r.notified, items:[], totalAmount:0 };
    billMap[r.billno].items.push(r);
    if (r.totalamount) billMap[r.billno].totalAmount = parseFloat(r.totalamount)||0;
  });
  const bills = Object.values(billMap).sort((a,b)=>b.billno-a.billno);

  const today = new Date(); today.setHours(0,0,0,0);

  // Dose status cards
  const doseCardsEl = document.getElementById('doseCards');
  doseCardsEl.innerHTML = '';
  bills.forEach(bill => {
    let statusClass='', statusText='', statusColor='', icon='📋', daysText='';
    if (bill.doseenddate) {
      const endDate = new Date(bill.doseenddate); endDate.setHours(0,0,0,0);
      const diffDays = Math.ceil((endDate-today)/(1000*60*60*24));
      if (diffDays < 0) { statusClass='ended'; statusText='Dose Ended'; statusColor='#c62828'; icon='🔴'; daysText=`Ended ${Math.abs(diffDays)} days ago`; }
      else if (diffDays === 0) { statusClass='due-soon'; statusText='Ends Today!'; statusColor='#f57f17'; icon='🟠'; daysText='Ends TODAY — Call patient!'; }
      else if (diffDays <= 3) { statusClass='due-soon'; statusText='Ending Soon'; statusColor='#f57f17'; icon='🟡'; daysText=`${diffDays} day(s) remaining`; }
      else { statusClass='active'; statusText='Active'; statusColor='#2e7d32'; icon='🟢'; daysText=`${diffDays} day(s) remaining`; }
    } else { statusClass=''; icon='📋'; daysText='No dose tracking'; }

    const meds = bill.items.map(i=>`${i.medicinename} (×${i.quantity})`).join(', ');
    const card = document.createElement('div');
    card.className = `dose-card ${statusClass}`;
    card.innerHTML = `
      <div class="dose-icon">${icon}</div>
      <div class="dose-info">
        <b>Bill #${bill.billno}</b> — ${bill.saledate||''}<br/>
        <div class="dose-sub">Medicines: ${meds}</div>
        ${bill.dosedays?`<div class="dose-sub">Dose: ${bill.dosedays} days | Ends: <b>${bill.doseenddate}</b> | ${daysText}</div>`:''}
      </div>
      <div class="dose-days-badge" style="background:${statusColor}20;color:${statusColor};">${statusText||'—'}</div>
      ${bill.doseenddate&&new Date(bill.doseenddate)<=today?`<button class="btn btn-secondary btn-sm" onclick="markNotified(${bill.items[0]?.id||0})">✔ Notified</button>`:''}`;
    doseCardsEl.appendChild(card);
  });
  if (!bills.length) doseCardsEl.innerHTML='<p style="color:var(--text-light);text-align:center;padding:20px;">No sale history for this patient.</p>';

  // Full table
  const tbody = document.getElementById('histBody');
  tbody.innerHTML='';
  let totalSpent=0, totalQty=0, billNos=new Set();
  rows.forEach(r => {
    const today2 = new Date().toISOString().split('T')[0];
    const ended = r.doseenddate && r.doseenddate > today2; // Wait, actually I should check logic here but user only asked for rebranding
    // ... skipping logic check to stay in scope ...
    const statusBadge = !r.doseenddate ? '' : (r.doseenddate <= today2) ? '<span class="badge badge-danger">Ended</span>' : '<span class="badge badge-success">Active</span>';
    const lt = (parseFloat(r.quantity)||0)*(parseFloat(r.saleprice)||0);
    totalSpent += parseFloat(r.totalamount||0);
    totalQty += parseFloat(r.quantity)||0;
    billNos.add(r.billno);
    const tr=document.createElement('tr');
    tr.innerHTML=`<td><b>${r.billno}</b></td><td>${r.medicinename}</td><td>${r.quantity}</td><td>${parseFloat(r.saleprice||0).toFixed(2)}</td><td style="font-weight:700">${lt.toFixed(2)}</td><td>${r.saledate||''}</td><td>${r.dosedays?r.dosedays+' days':'—'}</td><td>${r.doseenddate||'—'}</td><td>${statusBadge}</td>`;
    tbody.appendChild(tr);
  });
  if (!rows.length) tbody.innerHTML='<tr><td colspan="9" style="text-align:center;color:var(--text-light);padding:20px;">No records found.</td></tr>';

  // Stats
  document.getElementById('statBills').textContent = billNos.size;
  document.getElementById('statSpent').textContent = 'Rs '+formatCurrency(totalSpent);
  document.getElementById('statQty').textContent = totalQty;
  document.getElementById('doseStatusSection').style.display='block';
}

async function markNotified(id) {
  await window.api.markDoseNotified(id);
  loadSummary();
}

async function showAllDue() {
  document.getElementById('doseStatusSection').style.display='none';
  document.getElementById('patInfoCard').style.display='none';
  const due = await window.api.getDuePatientDoses();
  const el = document.getElementById('allDueList');
  const today = new Date().toISOString().split('T')[0];
  if (!due || !due.length) { el.innerHTML='<p style="color:#2e7d32;text-align:center;padding:20px;">✅ No due patient doses at this time.</p>'; }
  else {
    el.innerHTML='';
    due.forEach(d => {
      const ended = d.doseenddate <= today;
      const div=document.createElement('div');
      div.className=`dose-card ${ended?'ended':'due-soon'}`;
      div.innerHTML=`
        <div class="dose-icon">${ended?'🔴':'🟡'}</div>
        <div class="dose-info">
          <b>${d.name}</b> ${d.illness?'<span class="badge badge-warning">'+d.illness+'</span>':''}<br/>
          <div class="dose-sub">📞 ${d.mobile||'No phone'} | Dose ended: <b>${d.doseenddate}</b></div>
          <div class="dose-sub">Bill #${d.billno} | ${ended?'Dose has ended — contact patient!':'Dose ending soon!'}</div>
        </div>
        <button class="btn btn-primary btn-sm" onclick="callPatient('${d.mobile||''}','${d.name}')">📞 Call</button>
        <button class="btn btn-secondary btn-sm" onclick="markNotified(${d.id})">✔ Done</button>`;
      el.appendChild(div);
    });
  }
  document.getElementById('allDueSection').style.display='block';
}

function callPatient(mobile, name) {
  if (!mobile) { alert(`${name} has no mobile number registered.`); return; }
  alert(`Call ${name} on: ${mobile}\n\nReminder: Their medicine dose has ended. Please ask them to come in for a refill.`);
}

init();
</script>
</body>
</html>
