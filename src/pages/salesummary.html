<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Pharmco – Sale Summary</title>
<link rel="stylesheet" href="../css/style.css"/>
<script>try{if(localStorage.getItem("pharmco_theme")==="dark")document.documentElement.classList.add("dark-pre");}catch(e){}</script>
</head>
<style>
  .summary-footer {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 32px;
    margin-top: 32px;
    padding: 32px;
    background: rgba(0,0,0,0.15);
    border-radius: var(--radius-lg);
    border: 1px solid var(--border-color);
  }
</style>
</head>
<body>
<!-- Titlebar and Navigation are injected by common.js -->

<div class="page-body">
  <div class="page-header">
    <button class="btn" onclick="window.api.navigate('dashboard')">Dashboard</button>
    <h1>📋 Transaction Ledger</h1>
    <span class="badge update-badge" style="margin-left:auto;">F4: Reprint Filtered</span>
  </div>

  <div class="glass-card mb-8">
    <div class="card-title">Search & Filter Criteria</div>
    <div class="form-grid">
      <div class="form-group"><label>Transaction Date</label><input type="date" id="dtpDate" class="form-control" onchange="document.getElementById('dtpMonth').value=''"/></div>
      <div class="form-group"><label>Filter Month</label><input type="month" id="dtpMonth" class="form-control" onchange="document.getElementById('dtpDate').value=''"/></div>
      <div class="form-group"><label>Invoice Number</label><input type="text" id="txtfbn" class="form-control" placeholder="Search bill ID..."/></div>
      <div class="form-group"><label>Customer Name</label><input type="text" id="txtfbcn" class="form-control" placeholder="Search customer..."/></div>
      <div class="form-group">
        <label>Chronic Patient</label>
        <select id="cmbPatient" class="form-control">
          <option value="">-- All / General --</option>
        </select>
      </div>
      <div class="flex gap-4" style="grid-column: span 2; justify-content: flex-end; align-items: flex-end;">
        <button class="btn btn-secondary" onclick="clearFilters()">Clear Filters</button>
        <button class="btn btn-warning" onclick="reprintBill()" title="F4">Reprint Bill</button>
        <button class="btn btn-primary" onclick="loadSummary()" style="min-width: 180px;">🔍 Search Ledger</button>
      </div>
    </div>
  </div>

  <div class="glass-card">
    <div class="card-title">Ledger Entries</div>
    <div class="table-wrapper" style="max-height: 500px; overflow-y: auto;">
      <table class="dgv">
        <thead><tr><th>Bill No</th><th>Customer</th><th>Sale Date</th><th>Med ID</th><th>Medicine</th><th>Qty</th><th>Sale Price</th><th>Net Amt</th><th>Discount</th><th>Total</th></tr></thead>
        <tbody id="saleBody"></tbody>
      </table>
    </div>

    <div class="summary-footer">
      <div class="total-item">
        <label class="total-label">Aggregated Net</label>
        <input type="text" id="txtNA" class="form-control total-value-input" readonly style="color:var(--primary);"/>
      </div>
      <div class="total-item">
        <label class="total-label">Total Discounts</label>
        <input type="text" id="txtDis" class="form-control total-value-input" readonly style="color:var(--accent);"/>
      </div>
      <div class="total-item">
        <label class="total-label">Final Gross Total</label>
        <input type="text" id="txtTA" class="form-control total-value-input" readonly style="color:var(--secondary);"/>
      </div>
    </div>
  </div>
</div>
<script src="../js/common.js"></script>
<script>
requireAuthWithAccess('salesummary'); loadTopBar();
let currentItems = [];
let currentBillno = '';

async function loadSummary() {
  const date = document.getElementById('dtpDate').value;
  const month = document.getElementById('dtpMonth').value;
  const billno = document.getElementById('txtfbn').value.trim();
  const customer = document.getElementById('txtfbcn').value.trim();
  const patientid = document.getElementById('cmbPatient').value;
  let result;
  if (patientid) {
    // Filter by patient using patient sale history
    const rows = await window.api.getPatientSaleHistory(patientid);
    result = { items: rows };
  } else {
    result = await window.api.getSaleSummary({ date:date||null, month:month||null, billno:billno||null, customer:customer||null });
  }
  currentItems = result.items || [];
  if (billno && currentItems.length) { currentBillno = billno; document.getElementById('dtpDate').value = currentItems[0].saledate||''; }

  buildTable('saleBody', currentItems, [
    {key:'billno'},{key:'customername'},{key:'saledate'},{key:'medicineid'},
    {key:'medicinename'},{key:'quantity'},{key:'saleprice'},
    {key:'netamount',render:r=>r.netamount!=null?formatCurrency(r.netamount):''},
    {key:'discount',render:r=>r.discount!=null?formatCurrency(r.discount):''},
    {key:'totalamount',render:r=>r.totalamount!=null?formatCurrency(r.totalamount):''}
  ]);
  let na=0,dis=0,ta=0;
  currentItems.forEach(i=>{if(i.netamount!=null){na+=parseFloat(i.netamount)||0;dis+=parseFloat(i.discount)||0;ta+=parseFloat(i.totalamount)||0;}});
  document.getElementById('txtNA').value = formatCurrency(na);
  document.getElementById('txtDis').value = formatCurrency(dis);
  document.getElementById('txtTA').value = formatCurrency(ta);
}

async function reprintBill() {
  const billno = document.getElementById('txtfbn').value.trim();
  if (!billno) { alert('Please filter by Bill No first to reprint.'); return; }
  const items = currentItems.filter(i=>i.medicineid&&i.quantity>0);
  if (!items.length) { alert('No items found for this bill.'); return; }
  const settings = await window.api.getSettings();
  const user = getSession();
  const lastItem = currentItems.find(i=>i.totalamount!=null) || {};
  await window.api.printBill({
    type:'sale', billno,
    items: items,
    header: { pharmacyname:settings.pharmacyname, logo:settings.pharmacylogo, address:settings.pharmacyaddress, description:settings.pharmacydescription, user:user.username, customer:items[0].customername||'' },
    totals: { netamount:lastItem.netamount||0, discount:lastItem.discount||0, totalamount:lastItem.totalamount||0 }
  });
}

function clearFilters() {
  document.getElementById('dtpDate').value = todayStr();
  document.getElementById('dtpMonth').value = '';
  document.getElementById('txtfbn').value='';
  document.getElementById('txtfbcn').value='';
  document.getElementById('cmbPatient').value='';
  loadSummary();
}

document.addEventListener('keydown', e => { if(e.key==='F4'){e.preventDefault();reprintBill();} });
document.getElementById('dtpDate').value = todayStr();

// Load patients
(async () => {
  const patients = await window.api.getPatients();
  const sel = document.getElementById('cmbPatient');
  patients.forEach(p => sel.innerHTML += `<option value="${p.id}">${p.name}${p.illness?' ('+p.illness+')':''}</option>`);
})();

loadSummary();
</script>
</body>
</html>
