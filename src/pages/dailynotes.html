<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Pharmco – Daily Notes</title>
<link rel="stylesheet" href="../css/style.css"/>
<script>try{if(localStorage.getItem("pharmco_theme")==="dark")document.documentElement.classList.add("dark-pre");}catch(e){}</script>
<style>
  /* Premium Design for Notepad */
  .notepad-header {
    position: relative;
    padding: 40px;
    border-radius: var(--radius-lg);
    margin-bottom: 30px;
    overflow: hidden;
    color: white;
    box-shadow: var(--shadow-lg);
    background: linear-gradient(135deg, rgba(99, 102, 241, 0.8), rgba(16, 185, 129, 0.8));
  }
  .notepad-header::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: url('../assets/notepad_banner.jpg') center/cover;
    opacity: 0.4;
    mix-blend-mode: overlay;
    z-index: 0;
  }
  .notepad-header-content {
    position: relative;
    z-index: 1;
  }
  .notepad-header-content h1 {
    font-size: 32px;
    font-weight: 800;
    letter-spacing: -1px;
    margin-bottom: 8px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
  }
  .notepad-header-content p {
    font-size: 15px;
    opacity: 0.9;
  }

  .notes-layout {
    display: grid;
    grid-template-columns: 350px 1fr;
    gap: 30px;
  }

  .notes-sidebar {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .notes-feed {
    display: flex;
    flex-direction: column;
    gap: 20px;
    max-height: calc(100vh - 280px);
    overflow-y: auto;
    padding-right: 10px;
  }

  /* Custom Scrollbar for Feed */
  .notes-feed::-webkit-scrollbar { width: 8px; }
  .notes-feed::-webkit-scrollbar-track { background: transparent; }
  .notes-feed::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }

  .note-bubble {
    background: var(--bg-surface);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    padding: 24px;
    position: relative;
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    box-shadow: var(--shadow-sm);
    display: flex;
    gap: 16px;
  }
  .note-bubble:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 24px var(--primary-glow);
    border-color: var(--primary);
  }

  .note-avatar {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: bold;
    color: white;
    flex-shrink: 0;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  }

  .note-body {
    flex: 1;
  }

  .note-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }

  .note-author-name {
    font-weight: 700;
    font-size: 15px;
    color: var(--primary);
  }

  .note-timestamp {
    font-size: 12px;
    color: var(--text-muted);
    background: rgba(0,0,0,0.2);
    padding: 4px 10px;
    border-radius: 20px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .note-text {
    font-size: 15px;
    line-height: 1.6;
    color: var(--text-main);
    white-space: pre-wrap;
  }

  /* Note action buttons (edit + delete) — below the note text */
  .note-actions {
    display: flex;
    gap: 8px;
    margin-top: 14px;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .note-bubble:hover .note-actions {
    opacity: 1;
  }
  .note-action-btn {
    padding: 5px 14px;
    border-radius: 20px;
    border: none;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    transition: all 0.2s;
  }
  .note-action-btn.edit-btn {
    background: rgba(99, 102, 241, 0.15);
    color: var(--primary);
    border: 1px solid rgba(99, 102, 241, 0.3);
  }
  .note-action-btn.edit-btn:hover {
    background: var(--primary);
    color: white;
    transform: translateY(-1px);
  }
  .note-action-btn.delete-btn {
    background: rgba(239, 68, 68, 0.1);
    color: var(--danger);
    border: 1px solid rgba(239, 68, 68, 0.25);
  }
  .note-action-btn.delete-btn:hover {
    background: var(--danger);
    color: white;
    transform: translateY(-1px);
  }

  .glass-panel {
    background: var(--bg-surface);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    padding: 24px;
    backdrop-filter: var(--glass-blur);
    box-shadow: var(--shadow);
  }

  .form-control-modern {
    background: rgba(0,0,0,0.1);
    border: 1px solid var(--border-color);
    color: var(--text-main);
    padding: 14px;
    border-radius: var(--radius-sm);
    width: 100%;
    font-family: inherit;
    transition: all 0.3s;
  }
  .form-control-modern:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-glow);
    background: rgba(0,0,0,0.2);
  }

  .btn-gradient {
    background: linear-gradient(135deg, var(--primary), var(--primary-hover));
    color: white;
    border: none;
    padding: 14px 24px;
    border-radius: var(--radius-sm);
    font-weight: 700;
    cursor: pointer;
    width: 100%;
    transition: all 0.3s;
    box-shadow: 0 4px 12px var(--primary-glow);
  }
  .btn-gradient:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px var(--primary-glow);
  }

</style>
</head>
<body>

<div class="page-body">
  
  <div class="page-header">
    <button class="btn" onclick="window.api.navigate('dashboard')">Dashboard</button>
    <h1>📝 Daily Notes</h1>
  </div>

  <div class="notepad-header">
    <div class="notepad-header-content">
      <h1>Pharmco Notepad</h1>
      <p>Log daily cash transactions, shift summaries, and important operational notes.</p>
    </div>
  </div>

  <div class="notes-layout">
    
    <!-- Sidebar: Filter & Form -->
    <div class="notes-sidebar">
      
      <div class="glass-panel">
        <div class="card-title" style="margin-bottom: 16px; font-size: 16px;">📅 Date Filter</div>
        <input type="date" id="dateFilter" class="form-control-modern" onchange="loadNotes()">
      </div>

      <div class="glass-panel" style="flex:1;">
        <div class="card-title" style="margin-bottom: 16px; font-size: 16px;">✍️ Create Entry</div>
        <div class="form-group" style="margin-bottom: 14px;">
          <textarea id="noteContent" class="form-control-modern" rows="6" placeholder="Write a note...&#10;&#10;e.g., 'Took 3,000 RS for counter change' or 'End of day balance: 35,000 RS'"></textarea>
        </div>
        <button id="cancelEditBtn" style="display:none; width:100%; background:rgba(239,68,68,0.12); color:var(--danger); border:1px solid rgba(239,68,68,0.3); padding:10px; border-radius:var(--radius-sm); font-weight:600; cursor:pointer; margin-bottom:10px; transition:all 0.2s;">✕ Cancel Edit</button>
        <button id="postBtn" class="btn-gradient" onclick="saveNote()">Post Note</button>
      </div>

    </div>

    <!-- Main Feed: Notes -->
    <div class="glass-panel" style="padding-right: 12px;">
      <div class="flex justify-between items-center mb-6">
        <div class="card-title" style="font-size: 20px;">Timeline</div>
        <div id="notesCount" style="font-size: 13px; color: var(--text-muted); background: rgba(0,0,0,0.2); padding: 4px 12px; border-radius: 20px;">0 Notes</div>
      </div>
      
      <div class="notes-feed" id="notesList">
        <!-- Notes dynamically loaded here -->
      </div>
    </div>

  </div>

</div>

<script src="../js/common.js"></script>
<script src="../js/dailynotes.js"></script>
</body>
</html>
